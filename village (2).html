<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قريتي – المرحلة ١</title>
<style>
:root{--ink:#2b3a2a;--card:rgba(255,255,255,.9);--sky1:#bfe3f7;--sky2:#eaf6e4;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8f0e4;--card:rgba(28,38,36,.88);--sky1:#14212e;--sky2:#22362f}}
:root[data-theme="dark"]{--ink:#e8f0e4;--card:rgba(28,38,36,.88);--sky1:#14212e;--sky2:#22362f}
html,body{height:100%;margin:0;overflow:hidden;color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2));font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;left:10px;right:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.top{top:calc(10px + env(safe-area-inset-top,0px))}
.bot{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border-radius:14px;padding:8px 12px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.18);backdrop-filter:blur(6px)}
.card b{font-size:15px}
.btns{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:176px}
button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:12px;background:var(--card);text-align:center;line-height:38px;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
button.on{outline:2px solid #4caf50}#menu{display:none;pointer-events:auto;gap:6px;flex-wrap:wrap;justify-content:center}#menu.show{display:flex}#menu button{width:auto;padding:0 10px;font-size:14px}#cat{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding:6px}#cat button{flex:0 0 auto;width:46px;height:46px;line-height:46px;font-size:24px;box-shadow:none;background:rgba(127,127,127,.14)}#pan{display:none;pointer-events:auto;max-height:30vh;overflow-y:auto;padding:8px}#pan.show{display:block}#det{font-size:13px;margin-bottom:6px;min-height:18px}#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.it{background:rgba(127,127,127,.12);border-radius:12px;text-align:center;font-size:11px;padding:4px 2px;cursor:pointer;border:2px solid transparent}.it.on{border-color:#4caf50}.it img{width:100%;display:block}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud top"><div class="card"><b>🏡 قريتي — المرحلة ٢</b><br><span id="cnt"></span><br><span id="res">🪵 0 · 🌾 0</span></div>
<div class="btns"><button id="bs" title="حفظ">💾</button><button id="br" title="بداية جديدة">🔄</button><button id="bd" title="حذف">🗑️</button><button id="bg" title="الشبكة">▦</button><button id="bz" title="تقريب">＋</button><button id="bm" title="تبعيد">－</button><button id="bc" title="توسيط">◎</button></div></div>
<div class="hud bot" style="flex-direction:column;align-items:stretch"><div class="card" id="info">اختر منشأة من الأسفل ثم المس الأرض · المس مبنى لنقله · اسحب للتحريك</div><div class="card" id="pan"><div id="det"></div><div id="items"></div></div><div class="card" id="cat"></div></div>
<script>
const W=50,H=40,TW=64,TH=32,$=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let cw,ch,dpr,cam={x:0,y:0,s:1},grid=false,sel=null;
const P=(x,y,z=0)=>[(x-y)*TW/2,(x+y)*TH/2-z];
const R=(c,f=1,a=1)=>`rgba(${c.map(v=>Math.min(255,v*f)|0)},${a})`;
const hs=(x,y,k=0)=>{let n=Math.sin(x*127.1+y*311.7+k*74.7)*43758.5453;return n-Math.floor(n)};
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
function poly(pts,fill,line,lw=1){ctx.beginPath();pts.forEach((p,i)=>{const q=P(p[0],p[1],p[2]||0);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(line){ctx.strokeStyle=line;ctx.lineWidth=lw;ctx.stroke()}}
function seg(a,b,col,lw=1){const p=P(...a),q=P(...b);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.stroke()}
const ell=(x,y,rx,ry,fill)=>{ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=fill;ctx.fill()};

/* ---------- map ---------- */
const T=Array.from({length:W},()=>new Int8Array(H)); // 0 free 1 road 2 water 3 building 4 tree 5 rock
const NAMES=['متاح للبناء ✓','طريق','بركة ماء','مبنى','شجرة','صخرة','قطعة زراعية'];
const objs=[];
[[22,5,1.7],[33,6,2.3],[6,15,2],[32,16,1.8],[16,13,1.4]].forEach(([cx,cy,r])=>{
 for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(Math.hypot(x+.5-cx,y+.5-cy)<r+(hs(x,y,3)-.5)*.9)T[x][y]=2});
for(let x=6;x<=15;x++)T[x][4]=1;

for(let x=0;x<W;x++)for(let y=0;y<H;y++){
 if(x>=40||y>=25||T[x][y])continue;
 const base=x>=2&&x<=19&&y<=9;
 if(base)continue;
 const p=y>=20?.8:y>=18?.3:(x<3||x>36||y<2)?.35:.12;
 if(rnd()<p){T[x][y]=4;
  objs.push({k:'tree',x:x+.5+(rnd()-.5)*.45,y:y+.5+(rnd()-.5)*.45,s:.8+rnd()*.4,pine:rnd()>.45,v:rnd()});
  if(y>=20&&rnd()<.4)objs.push({k:'tree',x:x+.5+(rnd()-.5)*.8,y:y+.5+(rnd()-.5)*.8,s:.7+rnd()*.4,pine:rnd()>.4,v:rnd()});
 }else if(y<20&&rnd()<.04){T[x][y]=5;objs.push({k:'rock',x:x+.5,y:y+.5,s:.8+rnd()*.5})}
}
objs.push({k:'house',x:7,y:2,fw:2,fd:2,mv:1,c:[243,228,196],rc:[196,72,52],door:[.4,.62],wins:[[.08,.28],[.72,.92]],bw:[.3,.7],beam:1,shut:1,flower:1});
objs.push({k:'house',x:10,y:2,fw:2,fd:2,mv:1,c:[160,110,68],rc:[58,112,86],door:[.1,.32],wins:[[.46,.66],[.76,.94]],bw:[.3,.7],log:1,shut:0});
objs.push({k:'silo',x:13,y:2,fw:2,fd:2,mv:1});
const OBJ=Array.from({length:W},()=>Array(H).fill(null));let placing=null,mov=null,wood=0,crop=0,bat=0,money=1000000;
const dep=o=>o.x+o.y+((o.fw||0)+(o.fd||0))/2-(o.role=='field'?.6:0);
function occ(o,on){if(o.nocc)return;for(let i=0;i<(o.fw||1);i++)for(let j=0;j<(o.fd||1);j++){const x=o.x+i,y=o.y+j;OBJ[x][y]=on?o:null;T[x][y]=on?(o.role=='field'?6:3):0}}
objs.filter(o=>o.mv).forEach(o=>occ(o,1));
const SHORE=[];for(let x=0;x<W;x++)for(let y=0;y<H;y++)if(T[x][y]<2&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>x+a>=0&&y+b>=0&&x+a<W&&y+b<H&&T[x+a][y+b]==2))SHORE.push({x:x+.5,y:y+.5});
[[objs.find(o=>o.log),'wood'],[objs.find(o=>o.beam),'farm']].forEach(([h,r])=>objs.push({k:'worker',role:r,home:h,x:h.x+h.fw/2+.02,y:h.y+h.fd+.55,st:'idle',tm:0,car:null,fx:1,mvg:0,walk:false}));
objs.filter(o=>o.k=='house'||o.k=='silo').forEach(o=>{occ(o,0);objs.splice(objs.indexOf(o),1)});
$('cnt').textContent=`${W*H} مربع (${W}×${H}) · متاح: ${T.reduce((s,c)=>s+c.reduce((a,v)=>a+(v==0),0),0)}`;

/* ---------- tiles ---------- */
const GR=[118,178,76],DIRT=[128,88,52],WAT=[72,160,212],SAND=[226,208,150],ROAD=[170,170,176];
const isW=(x,y)=>x<0||y<0||x>=W||y>=H||T[x][y]==2;
const isR=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&T[x][y]==1;
function tile(x,y,t){
 if(x==W-1)poly([[x+1,y],[x+1,y+1],[x+1,y+1,-16],[x+1,y,-16]],R(DIRT,.72));
 if(y==H-1)poly([[x,y+1],[x+1,y+1],[x+1,y+1,-16],[x,y+1,-16]],R(DIRT,.95));
 const v=T[x][y],h=hs(x,y),sq=[[x,y],[x+1,y],[x+1,y+1],[x,y+1]],[cx,cy]=P(x+.5,y+.5);
 if(v==2){
  poly(sq,R(WAT,.95+h*.1));
  [[x,y-1,[[x,y],[x+1,y],[x+1,y+.14],[x,y+.14]]],[x+1,y,[[x+1,y],[x+1,y+1],[x+.86,y+1],[x+.86,y]]],[x,y+1,[[x,y+1],[x+1,y+1],[x+1,y+.86],[x,y+.86]]],[x-1,y,[[x,y],[x,y+1],[x+.14,y+1],[x+.14,y]]]]
   .forEach(([a,b,s])=>{if(!isW(a,b))poly(s,R(SAND,.95))});
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.beginPath();
  const k=Math.sin(t/800+x*1.3+y*.7);ctx.ellipse(cx+k*5,cy+(h-.5)*6,8+h*5,2.5+k*.6,0,0,6.3);ctx.stroke();
  return}
 if(v==1){roadTile(x,y,sq,h);return}if(false){
  poly(sq,R(ROAD,.96+h*.08));
  if(!isR(x,y-1))poly([[x,y],[x+1,y],[x+1,y+.1],[x,y+.1]],R(ROAD,.8));
  if(!isR(x,y+1))poly([[x,y+1],[x+1,y+1],[x+1,y+.9],[x,y+.9]],R(ROAD,.8));
  seg([x,y+.5],[x+1,y+.5],R(ROAD,.7),1.2);seg([x+.5,y],[x+.5,y+.5],R(ROAD,.7),1.2);seg([x+.25,y+.5],[x+.25,y+1],R(ROAD,.7),1.2);seg([x+.75,y+.5],[x+.75,y+1],R(ROAD,.7),1.2);
  for(let i=0;i<3;i++){const q=P(x+hs(x,y,i)*.8+.1,y+hs(x,y,i+9)*.8+.1);ell(q[0],q[1],2.5,1.3,R(ROAD,.7+i*.15))}
  return}
 poly(sq,R(GR,(x+y)%2?.96:1.02)); ctx.globalAlpha=.55;poly(sq,R(GR,.85+h*.3));ctx.globalAlpha=1;
 if(h>.5){ctx.strokeStyle=R(GR,.72);ctx.lineWidth=1.3;ctx.beginPath();for(let i=-1;i<2;i++){ctx.moveTo(cx+i*4,cy+2);ctx.lineTo(cx+i*5-1,cy-3-(h*4))}ctx.stroke()}
 if(hs(x,y,5)>.93){ell(cx+5,cy-1,2.2,1.6,hs(x,y,6)>.5?'#ffe45e':'#fff')}
}

/* ---------- objects ---------- */
function tree(o,t){
 const [sx,sy]=P(o.x,o.y),s=o.s,sw=Math.sin(t/900+o.x*1.7+o.y)*1.6*s+(o.shake?Math.sin(t/70)*3.5*s:0),f=.85+o.v*.3;
 ell(sx+4*s,sy+1,15*s,6*s,'rgba(0,0,0,.18)');
 ctx.fillStyle='#6b4527';ctx.fillRect(sx-3*s,sy-14*s,6*s,14*s);
 if(o.pine){const G=[44,122,72];
  for(let i=0;i<3;i++){const w=(22-i*4.5)*s,by=sy-(8+i*12)*s,ty=by-22*s,tx=sx+sw*(i+1)/3;
   ctx.beginPath();ctx.moveTo(sx-w,by);ctx.lineTo(tx,ty);ctx.lineTo(sx,by+4*s);ctx.fillStyle=R(G,1.15*f);ctx.fill();
   ctx.beginPath();ctx.moveTo(sx+w,by);ctx.lineTo(tx,ty);ctx.lineTo(sx,by+4*s);ctx.fillStyle=R(G,.78*f);ctx.fill()}
 }else{const G=o.v>.8?[150,170,60]:[78,160,70];
  ctx.beginPath();ctx.arc(sx+sw,sy-32*s,18*s,0,7);ctx.fillStyle=R(G,.78);ctx.fill();
  ctx.beginPath();ctx.arc(sx-4*s+sw,sy-36*s,14*s,0,7);ctx.fillStyle=R(G,1);ctx.fill();
  ctx.beginPath();ctx.arc(sx-7*s+sw,sy-41*s,7*s,0,7);ctx.fillStyle=R(G,1.22);ctx.fill()}
}
function rock(o){
 const [sx,sy]=P(o.x,o.y),s=o.s,g=[142,144,152];
 const pt=(a)=>a.map(([x,y])=>[sx+x*s,sy+y*s]);
 ell(sx+4*s,sy+2,18*s,6*s,'rgba(0,0,0,.18)');
 const fill=(a,c)=>{ctx.beginPath();pt(a).forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.fillStyle=R(g,c);ctx.fill()};
 fill([[-16,0],[-12,-13],[0,-20],[0,4]],.95);fill([[0,-20],[13,-11],[17,0],[0,4]],.7);fill([[-12,-13],[0,-20],[13,-11],[0,-8]],1.2);
 fill([[10,0],[14,-7],[22,-3],[22,2]],.8);
}
function hay(o){
 const [sx,sy]=P(o.x,o.y);ell(sx+3,sy+2,26,8,'rgba(0,0,0,.16)');
 [[-12,0],[8,0],[-2,-14]].forEach(([dx,dy])=>{const x=sx+dx,y=sy+dy;
  ctx.fillStyle='#e0b94a';ctx.fillRect(x-9,y-12,18,12);ell(x,y,9,3,'#c99d32');ell(x,y-12,9,3,'#f0d070');
  ctx.strokeStyle='#8a5e22';ctx.lineWidth=1.3;ctx.strokeRect(x-9,y-8,18,2.2)});
 for(let i=0;i<4;i++){const x=sx+22+i*5,y=sy+i%2*3;ctx.strokeStyle='#d9b840';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.sin(performance.now()/700+i)*2,y-14);ctx.stroke()}
}
function logs(o){
 const [sx,sy]=P(o.x,o.y);ell(sx+4,sy+3,28,8,'rgba(0,0,0,.16)');
 const row=(n,y0,x0)=>{for(let i=0;i<n;i++){const x=sx+x0+i*13,y=sy+y0;ctx.fillStyle='#8a5a32';ctx.fillRect(x-7,y-9,22,9);ell(x+15,y-4.5,4.5,4.5,'#e4c08a');ell(x+15,y-4.5,2,2,'#b88a52');ell(x-7,y-4.5,4.5,4.5,'#6e4526')}};
 row(3,2,-24);row(2,-7,-17);row(1,-16,-10);
 ctx.fillStyle='#7a5230';ctx.fillRect(sx+22,sy-8,12,10);ell(sx+28,sy-8,6,2.5,'#d9b27a');
 ctx.strokeStyle='#5a3a20';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx+28,sy-9);ctx.lineTo(sx+36,sy-22);ctx.stroke();
 ctx.fillStyle='#b9c0c8';ctx.beginPath();ctx.moveTo(sx+33,sy-22);ctx.lineTo(sx+44,sy-20);ctx.lineTo(sx+37,sy-14);ctx.fill();
}
function win(f,u1,u2,z1,z2,dk,sh){
 const q=(a,b,c,d,fill)=>poly([f(a,c),f(b,c),f(b,d),f(a,d)],fill);
 if(sh){q(u1-.11,u1-.03,z1-2,z2+2,dk?'#3f7f52':'#4d9a63');q(u2+.03,u2+.11,z1-2,z2+2,dk?'#3f7f52':'#4d9a63')}
 q(u1-.03,u2+.03,z1-2,z2+2,dk?'#d9d2c4':'#f6f1e6');q(u1,u2,z1,z2,dk?'#5f94b0':'#8fc8e4');
 const um=(u1+u2)/2,zm=(z1+z2)/2;seg(f(um,z1),f(um,z2),'#f6f1e6',1.6);seg(f(u1,zm),f(u2,zm),'#f6f1e6',1.6);
 q(u1-.04,u2+.04,z1-4,z1-2,dk?'#b8ac96':'#d9cdb8');
}
function house(o,t){
 const x0=o.x,y0=o.y,w=2,d=2,H=40,Rh=34,X1=x0+w,Y1=y0+d,ym=y0+1;
 const fa=(u,z)=>[x0+u*w,Y1,z],fb=(u,z)=>[X1,y0+u*d,z];
 const qa=(a,b,c,e,fl)=>poly([fa(a,c),fa(b,c),fa(b,e),fa(a,e)],fl),qb=(a,b,c,e,fl)=>poly([fb(a,c),fb(b,c),fb(b,e),fb(a,e)],fl);
 poly([[x0,Y1],[X1,Y1],[X1+.5,Y1-.4],[X1+.5,y0+.1],[X1,y0]],'rgba(0,0,0,.17)');
 poly([fa(0,0),fa(1,0),fa(1,H),fa(0,H)],R(o.c,1));poly([fb(0,0),fb(1,0),fb(1,H),fb(0,H)],R(o.c,.78));
 if(o.log){for(let z=7;z<H;z+=7){seg(fa(0,z),fa(1,z),R(o.c,.62),1.6);seg(fb(0,z),fb(1,z),R(o.c,.5),1.6)}
  qa(0,.035,0,H,R(o.c,.7));qb(.965,1,0,H,R(o.c,.55));qb(0,.035,0,H,R(o.c,.55))}
 if(o.beam){const B=[110,72,44];qa(0,.04,0,H,R(B,1));qa(.96,1,0,H,R(B,1));qa(0,1,H-5,H,R(B,1));qb(0,.05,0,H,R(B,.8));qb(.95,1,0,H,R(B,.8));qb(0,1,H-5,H,R(B,.8));qa(.5,.52,0,H-5,R(B,1))}
 const S=[150,148,142];qa(0,1,0,6,R(S,1));qb(0,1,0,6,R(S,.78));
 // door
 const [a,b]=o.door;qa(a-.04,b+.04,0,30,R([90,58,34],1));qa(a,b,0,28,R([140,92,54],1));seg(fa((a+b)/2,0),fa((a+b)/2,28),R([90,58,34]),1.4);
 const kn=P(...fa(b-.04,13));ell(kn[0],kn[1],1.8,1.8,'#f2cf58');qa(a-.06,b+.06,0,3,R(S,1.1));
 o.wins.forEach(([u1,u2])=>{win(fa,u1,u2,16,32,0,o.shut);
  if(o.flower){qa(u1-.04,u2+.04,10,14,'#7a4a2a');for(let i=0;i<4;i++){const p=P(...fa(u1+.01+i*(u2-u1)/3.4,15));ell(p[0],p[1],2,2,['#e85a7a','#ffd34d','#fff','#e85a7a'][i])}}});
 win(fb,o.bw[0],o.bw[1],16,32,1,o.shut);
 // roof
 const rc=o.rc,ov=.18;
 poly([[X1,y0,H],[X1,Y1,H],[X1,ym,H+Rh]],R(o.c,.74));
 poly([[X1,ym-.13,H+5],[X1,ym+.13,H+5],[X1,ym+.13,H+17],[X1,ym-.13,H+17]],'#f1ebdd');poly([[X1,ym-.09,H+7],[X1,ym+.09,H+7],[X1,ym+.09,H+15],[X1,ym-.09,H+15]],'#5f94b0');
 const ex=Y1+ov,ez=H-3;
 poly([[x0-.15,ex,ez],[X1+.15,ex,ez],[X1+.15,ym,H+Rh],[x0-.15,ym,H+Rh]],R(rc,1));
 for(let k=1;k<6;k++){const f=k/6,yy=ex-f*(ex-ym),zz=ez+f*(H+Rh-ez);seg([x0-.15,yy,zz],[X1+.15,yy,zz],R(rc,.72),1.5)}
 for(let u=0;u<=1.001;u+=.125)seg([x0-.15+u*(w+.3),ex,ez],[x0-.15+u*(w+.3),ym,H+Rh],R(rc,.8),.8);
 poly([[x0-.15,ex,ez],[X1+.15,ex,ez],[X1+.15,ex,ez-5],[x0-.15,ex,ez-5]],R(rc,.62));
 poly([[X1+.15,ex,ez],[X1+.15,ym,H+Rh],[X1+.15,ym,H+Rh-5],[X1+.15,ex,ez-5]],R(rc,.55));
 seg([x0-.15,ym,H+Rh],[X1+.15,ym,H+Rh],R(rc,.5),3.5);
 // chimney
 const cx=x0+1.3,cz=H+Rh-8,ct=H+Rh+16,B2=[150,90,70];
 poly([[cx,ym,cz],[cx+.3,ym,cz],[cx+.3,ym,ct],[cx,ym,ct]],R(B2,1));poly([[cx+.3,ym-.3,cz],[cx+.3,ym,cz],[cx+.3,ym,ct],[cx+.3,ym-.3,ct]],R(B2,.75));
 poly([[cx-.03,ym+.03,ct],[cx+.33,ym+.03,ct],[cx+.33,ym-.33,ct],[cx-.03,ym-.33,ct]],'#5b4038');
 for(let i=0;i<3;i++){const ph=(t/2800+i/3)%1,p=P(cx+.15,ym-.15,ct+ph*45);ell(p[0]+ph*10,p[1],4+ph*7,4+ph*7,`rgba(255,255,255,${.55*(1-ph)})`)}
}
function silo(o,t){
 const [sx,sy]=P(o.x+1,o.y+1),r=.88,rx=r*TW*.7071,ry=r*TH*.7071,bh=46,cH=42,WL=[214,186,142],RC=[198,74,52];

function chips(){const s={};objs.forEach(o=>{if(o.inv&&STO[o.role])for(const k in o.inv)s[k]=(s[k]||0)+o.inv[k]});const g=x=>Object.keys(s).filter(k=>RS[k][0]==x).reduce((a,k)=>a+s[k],0);const it=[['🪵',g('wood')],['🌾',g('crop')],['🍞',g('food')],['⚙️',g('goods')-(s.bat||0)],['🔋',s.bat||0],['⛽',g('fuel')],['👷',objs.filter(o=>o.k=='worker').length]];$('res2').innerHTML=it.map(([e,v])=>`<span class='ch'>${e} ${v}</span>`).join('')}
$('dock').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.d;if(k=='del'){$('bd').click();return}if(shKind==k){closeSheet();return}showSheet(k)};
$('sx').onclick=closeSheet;$('av').onclick=()=>showSheet('prof');$('bal').onclick=()=>showSheet('wallet');
$('gear').onclick=()=>{$('gm').style.display=$('gm').style.display=='flex'?'none':'flex'};
$('gm').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;$(b.dataset.g).click();if(b.dataset.g!='br')$('gm').style.display='none'};
$('z1').onclick=()=>$('bz').click();$('z2').onclick=()=>$('bm').click();$('z3').onclick=()=>$('bc').click();
$('pe').onclick=()=>{placing=null;mov=null;if(delMode)$('bd').click()};
$('sb').onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,D=t.dataset;
 if(a=='cat'){bcat=+D.i;render()}
 else if(a=='pick')selectItem(+D.i);
 else if(a=='tq'){const st=whStock(),k=D.k,m=Math.min(20,st[k]||0);TO[k]=Math.max(0,Math.min(m,D.d=='20'?m:(TO[k]||0)+(+D.d)));render()}
 else if(a=='send'){sendTruck();render()}
 else if(a=='mv'){mov=detObj;closeSheet();toast('المس مربعاً فارغاً لنقل المنشأة (الزاوية العلوية)')}
 else if(a=='del'){if(delThing(detObj))closeSheet()}
 else if(a=='wq')$('wa').value=D.v;
 else if(a=='wd'){const v=Math.floor(+$('wa').value);if(!(v>=100))toast('الحد الأدنى للسحب 100$');else if(v>money)toast('الرصيد لا يكفي');else{money-=v;UP.tx.unshift({t:Date.now(),a:v,s:'قيد المعالجة'});saveUP();toast('تم طلب سحب '+v.toLocaleString()+'$');render()}}};
$('sb').onchange=e=>{if(e.target.id=='pf')readAv(e.target.files[0])};
$('sb').oninput=e=>{if(e.target.id=='pnm'){UP.name=e.target.value.slice(0,20)||'اللاعب';saveUP()}};
let lastK='';
setInterval(()=>{$('bv').textContent=Math.floor(money).toLocaleString();const n=objs.filter(o=>o.mv).length,k=UP.av+'|'+UP.name;if(k!=lastK){lastK=k;$('av').innerHTML=UP.av?`<img src='${UP.av}'>`:'🧑‍🌾';$('pn').textContent=UP.name}$('plv').textContent='المستوى '+(1+Math.floor(n/5))+' · '+n+' منشأة';chips();
 let t='';if(placing)t='📍 '+ITEMS[placing-1][1]+' — المس الأرض للبناء (بلا حدّ)';else if(mov)t='↔ المس مربعاً فارغاً لنقل المنشأة';else if(delMode)t='🗑️ وضع الحذف: المس منشأة (السعر حسب النوع) أو صخرة (50$) أو طريقاً (مجاناً)';$('pbar').style.display=t?'flex':'none';$('pt').textContent=t;[...document.querySelectorAll('#dock button')].forEach(b=>{if(b.dataset.d=='del')b.classList.toggle('on',delMode)})},500);
setInterval(()=>{if(shKind=='truck'||shKind=='det'||shKind=='fact'){if(shKind=='det'&&!objs.includes(detObj)){closeSheet();return}const y=$('sb').scrollTop;render();$('sb').scrollTop=y}},900);
applyRM();
addEventListener('resize',()=>{rs()});rs();center();requestAnimationFrame(frame);
</script></body></html>
